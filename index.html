<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomb of the Lich Queen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="setup" hidden>
  <h1>Tomb of the Lich Queen</h1>
  <p>Choose your party of four. The first two stand in the front row, the last two in the back.</p>
  <div id="slots"></div>
  <details id="creator">
    <summary>Create a hero</summary>
    <form id="createForm">
      <label>Name <input id="cName" maxlength="14"></label>
      <label>Class <select id="cClass"></select></label>
      <div id="cBlurb"></div>
      <div id="cAttrs"></div>
      <div id="cPoints"></div>
      <button type="submit">Add to roster</button>
      <div id="cErr" role="alert"></div>
    </form>
  </details>
  <div id="setupErr" role="alert"></div>
  <button id="startBtn" type="button">Enter the tomb</button>
</section>
<main id="game" hidden>
  <div id="viewframe"><canvas id="view" width="448" height="300"></canvas>
    <div id="overlay" hidden><div id="overlayText"></div><button id="retryBtn" type="button" hidden>Try again</button></div></div>
  <aside id="party"></aside>
  <div id="controls">
    <div id="compass">N</div>
    <div id="pad">
      <button data-act="turnL">&#8630;</button>
      <button data-act="fwd">&#9650;</button>
      <button data-act="turnR">&#8631;</button>
      <button data-act="strL">&#9664;</button>
      <button data-act="back">&#9660;</button>
      <button data-act="strR">&#9654;</button>
    </div>
    <div id="log"></div>
  </div>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
